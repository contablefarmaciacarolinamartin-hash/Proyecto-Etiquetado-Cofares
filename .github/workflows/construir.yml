name: Construir ejecutable Windows

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - run: xvfb-run -a python -m pytest -q

  windows:
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write  # para publicar la versión en "Releases"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      # La automatización de Cofares con Microsoft Edge, como en la farmacia
      - name: Pruebas con Edge
        env:
          PRUEBAS_CANAL: msedge
        run: python -m pytest -q tests/test_cofares_web.py tests/test_ventana_envio.py
      - run: python -m PyInstaller --noconfirm --clean --windowed --name EtiquetasCofares --hidden-import win32timezone etiquetas_cofares.py
      - name: Comprobar que el .exe incluye el control del navegador
        shell: pwsh
        run: |
          $p = Start-Process dist/EtiquetasCofares/EtiquetasCofares.exe -ArgumentList "--comprobar" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EtiquetasCofares.exe --comprobar ha fallado ($($p.ExitCode))" }
      - shell: pwsh
        run: Copy-Item config.ini, plantilla.lbx, plantilla_frio.lbx, instalar_inicio_automatico.bat, LEEME.md dist/EtiquetasCofares/
      - uses: actions/upload-artifact@v4
        with:
          name: EtiquetasCofares-windows
          path: dist/EtiquetasCofares/
      - name: Empaquetar zip
        shell: pwsh
        run: Compress-Archive -Path dist/EtiquetasCofares/* -DestinationPath EtiquetasCofares-windows.zip
      # Descarga permanente: siempre la última en
      # https://github.com/<repo>/releases/latest/download/EtiquetasCofares-windows.zip
      - name: Publicar versión
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Etiquetas Cofares v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Descarga EtiquetasCofares-windows.zip, clic derecho → Propiedades → Desbloquear,
            descomprímelo en C:\EtiquetasCofares-windows (reemplazando) y ejecuta instalar_inicio_automatico.bat.
          files: EtiquetasCofares-windows.zip
          make_latest: "true"
