name: Construir ejecutable Windows

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --windowed --name EtiquetasCofares --hidden-import win32timezone etiquetas_cofares.py
      - shell: pwsh
        run: Copy-Item config.ini, plantilla.lbx, plantilla_frio.lbx, instalar_inicio_automatico.bat, LEEME.md dist/EtiquetasCofares/
      - uses: actions/upload-artifact@v4
        with:
          name: EtiquetasCofares-windows
          path: dist/EtiquetasCofares/
