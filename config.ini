; Configuración del Impresor de Etiquetas Cofares.
; Tras cambiar algo, cierra y vuelve a abrir el programa.

[general]
; Carpeta donde el navegador descarga los PDF (por defecto, Descargas).
carpeta_vigilada = %USERPROFILE%\Downloads
; Solo se imprimen los PDF cuyo nombre encaje con este patrón.
patron = etiqueta_*.pdf
; Tras imprimir, se pone esta marca delante del nombre del PDF
; (etiqueta_FM...pdf -> !etiqueta_FM...pdf) para no volver a imprimirlo.
marca_impresa = !
; Marca para los PDF que no se han podido leer o imprimir. Para reintentar,
; quita la marca del nombre. (Windows no admite ? en los nombres.)
marca_error = #
; si = al arrancar imprime también los PDF que ya estaban en la carpeta.
imprimir_pendientes_al_arrancar = no

[impresora]
nombre = Brother QL-800 COFARES
; Ruta de la plantilla. Si es relativa, se busca junto al programa.
plantilla = plantilla.lbx
copias = 1

[formato]
; Texto que se pone en cada cuadro de la plantilla.
; Valores disponibles: {codigo} {remite} {destino} {centro} {n1} {n3}
; Si se deja vacío, el cuadro conserva el texto de la plantilla.
titulo =
codigo = {codigo}
remite = Remite: {remite}
destino = Destino: {destino}
centro = Centro={centro}
n1 = N1:{n1}
n3 = N3:{n3}
